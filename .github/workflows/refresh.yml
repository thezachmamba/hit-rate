name: Refresh rankings

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC), offset from the top of the hour when GitHub is busiest
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect, extract, grade and score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node pipeline/run.mjs
      - name: Commit updated data
        run: |
          git config user.name "rankings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && git add -A data site/data
          git diff --cached --quiet || git commit -m "Refresh rankings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
